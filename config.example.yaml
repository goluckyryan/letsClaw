# letsClaw Configuration — Example Template
# Copy to config.yaml and customize.

# Model registry — every entry is self-contained: it names its own server, so
# reading one entry tells you everything about that model.
#   default_model: which entry to start with
#   -m <name>     : override at startup (./run.sh -m <name>)
#   provider_name: the exact model ID the server reports (check /v1/models)
#   base_url     : required — the OpenAI-compatible endpoint serving this model
#   api_key      : omit or "" when the server needs no key
#   context_length: total window the server was launched with — the budget the
#                   ⚡ stats line reports against (max_tokens caps output only)
models:
  default_model: "qwen36"
  qwen36:
    provider_name: "Qwen/Qwen3.6-35B-A3B"
    base_url: "http://localhost:8000/v1"
    api_key: ""                          # omit or "" if the server needs no key
    behavior_file: "models/default.md"
    context_length: 12000
    temperature: 0.7
    max_tokens: 4096
    top_p: 0.95
  # Example: a second model on another server (e.g. llama.cpp + GGUF)
  qwen38:
    provider_name: "path/or/id/exactlly-as-reported-by-the-server"
    base_url: "http://192.168.203.75:8080/v1"
    api_key: ""
    behavior_file: "models/default.md"   # each model can have its own MD
    context_length: 32768
    temperature: 0.7
    max_tokens: 4096
    top_p: 0.95

# Agent tools
tools:
  enabled: true
  allow: [exec, read_file, write_file, list_dir]   # anything not listed is denied
  max_iterations: 8           # max tool rounds per user turn before forced final answer
  exec_timeout: 120           # seconds
  max_output_chars: 8000      # tool output truncation

# Conversation settings  (context_length lives per model, under models:)
conversation:
  max_history_messages: 50      # messages kept per session
  rollover_at_percent: 90       # % of the model's context_length that trips a rollover (0 = never)
  rollover_mode: "auto"         # auto = roll over and say so | ask = prompt [y/N] | off = warn only
                                # /new forces a rollover in any mode
  sessions_dir: "state/sessions"  # archived transcripts land here

# Memory settings
memory:
  long_term_file: "state/memory_store/long_term.md"   # rollover handoffs are appended here

# Logging
logging:
  level: "INFO"
  file: "logs/letclaw.log"
