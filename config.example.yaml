# letsClaw Configuration — Example Template
# Copy to config.yaml and customize.

# Behavior — Markdown sent with every prompt. The base file is shared by all
# models (identity, working style, tool notes); each model's behavior_file
# layers per-model tuning on top of it. A missing file is a warning at core
# startup and an empty file — the core keeps running.
behavior:
  base_file: "models/base.md"

# Model registry — every entry is self-contained: it names its own server, so
# reading one entry tells you everything about that model.
#   default_model: which entry to start with
#   -m <name>     : override at startup (./terminalUI.sh -m <name>)
#   provider_name: the exact model ID the server reports (check /v1/models)
#   base_url     : required — the OpenAI-compatible endpoint serving this model
#   api_key      : omit or "" when the server needs no key
#   context_length: total window the server was launched with — the budget the
#                   ⚡ stats line reports against (max_tokens caps output only)
models:
  default_model: "qwen36"
  qwen36:
    provider_name: "Qwen/Qwen3.6-35B-A3B"
    base_url: "http://localhost:8000/v1"
    api_key: ""                          # omit or "" if the server needs no key
    behavior_file: "models/default.md"
    context_length: 12000
    temperature: 0.7
    # On a thinking model max_tokens caps reasoning AND the answer together, so
    # this is really "how much the model may generate per round" — a chunk size,
    # not a limit on how much it may think in total. A round cut off
    # mid-reasoning is resumed, not re-asked; see "Reasoning" in the README.
    # Smaller is not cheaper: the pad is re-sent every round, so halving this
    # roughly quadruples the prompt tokens processed for the same thinking.
    max_tokens: 4096
    # The answer sheet. Once thinking has been closed with </think>, the closing
    # round runs under this cap and every token of it buys answer, not
    # reasoning. 0 = the closing round keeps max_tokens.
    max_output_tokens: 32768
    # Whether a cut-off round is resumed at all. There is deliberately no budget
    # on how many times it may resume: the pad grows until time or context stops
    # it, or until a round comes back having written nothing.
    # false = no pad: a cut-off round falls back to the base.md directive.
    reasoning: true
    # Keep the "## Checkpoint" and "## Forced conclusion" blocks out of the
    # system prompt for this model. They are templates the core sends as user
    # messages at the moment each applies, and they sit in base.md only so they
    # can be tuned; a local thinking model ignores the copy in its prompt, but a
    # hosted assistant reads the whole prompt as standing instruction and obeys
    # it — Claude via ANL's Argo, told every turn that "this is not the final
    # answer", replies with nothing at all. Extraction is unaffected either way.
    # Leave false for local models; set true for a hosted API.
    strip_directives: false
    # Hard wall for one turn, in seconds — a limit on a round, thinking model or
    # not. It also sets the HTTP client's read timeout, so a round that runs
    # longer is cut off and the turn cancelled (the conversation is saved).
    # 0 = no wall. Default 36000 (10 h).
    turn_timeout: 36000
    # Seconds held back from turn_timeout so the answer still fits inside the
    # wall after a long think. Thinking stops at turn_timeout - this.
    answer_time_reserve: 120
    # When the pad fills the context, distil it to a checkpoint (the model's own
    # note of what it has established) plus the last ~2000 tokens kept verbatim,
    # then carry on thinking. This is the only wall that can be pushed back, so
    # it is what makes thinking bounded by time rather than by context.
    # 0 (default) = never compact: fill the context and conclude. Compaction is
    # lossy, and a derivation carrying exact values through many steps is
    # usually better concluded from a whole pad than continued from a summary —
    # raise this only for analyses long enough that running out of room is the
    # worse outcome. The note comes from "## Checkpoint" in the base file.
    max_pad_compactions: 0
    # How a cut-off round is resumed:
    #   auto - probe the server once and pick (default)
    #   chat - OpenAI-compatible prefill (vLLM/SGLang continue_final_message)
    #   raw  - llama.cpp /apply-template + /completion
    #   off  - no resume; fall back to the base.md directive, losing the work
    resume_mode: auto
    # Passed to the chat template. Qwen3 turns this into a system directive;
    # llama.cpp defaults to xhigh, which on its own causes a lot of the
    # mid-reasoning cut-offs. "medium" adds no directive at all. Omit to leave
    # the server's default alone.
    reasoning_effort: medium
    top_p: 0.95
  # Example: a second model on another server (e.g. llama.cpp + GGUF)
  qwen38:
    provider_name: "path/or/id/exactlly-as-reported-by-the-server"
    base_url: "http://192.168.203.75:8080/v1"
    api_key: ""
    behavior_file: "models/default.md"   # each model can have its own MD
    context_length: 32768
    temperature: 0.7
    max_tokens: 4096
    top_p: 0.95

# Core service — start this first (./serve.sh); clients connect to it
core:
  bind: "127.0.0.1"     # tools are unconfined: anyone who can reach this port gets a shell here
  port: 8770            # also serves the WebUI at http://<bind>:<port>/
  token: ""             # optional shared secret; required in practice if bind is not loopback
                        # the WebUI prompts for it (the page itself is served unauthenticated)
                        #
                        # bind and port are the only settings here that need a restart:
                        # the socket is already bound, and rebinding it would drop every
                        # client. Everything else in this file is picked up by /reload
                        # (or the ♻️ button) without stopping the core.

# Discord client — a client like the terminal and the WebUI, in its own process
# (./run_discord.sh). The core never imports discord.py and does not know this
# exists. Omit the whole section if you do not want a bot.
#
# ⚠️  A bot is a remote shell. The tools below are unconfined, so anyone who can
# get a message to this bot can run commands on the machine hosting the core.
# Anyone on Discord can DM a bot by default, and in a guild the only wall is
# Discord's own channel permissions — so `users` is a REQUIRED allowlist of
# snowflake IDs, and an empty list refuses everybody. That is the safe default,
# not an oversight: fill it in deliberately.
#
# To get a bot: https://discord.com/developers/applications → New Application →
# Bot → copy the token below, and switch ON "Message Content Intent" under
# Privileged Gateway Intents or every message arrives empty. Invite it with the
# `bot` scope and the Send Messages + Read Message History permissions.
# discord:
#   token: ""             # bot token — config.yaml is gitignored, so it stays put
#   core: "ws://127.0.0.1:8770"   # default: built from core.bind/core.port above
#   core_token: ""        # defaults to core.token; set only if the bot runs elsewhere
#   # Who may talk to the bot. Snowflake IDs (Discord → Settings → Advanced →
#   # Developer Mode, then right-click a user → Copy User ID). Empty = nobody.
#   users:
#     - 123456789012345678
#   # Guild channels: only answer when @mentioned or replied to. Hygiene, not
#   # security — it keeps the bot quiet in a busy channel. DMs always answer.
#   # With this false, a bare "yes" in the channel can also answer a pending
#   # rollover question, which is reason enough to leave it on.
#   mention_only: true
#   # Close an idle channel's socket after this long. The conversation is NOT
#   # lost — the core keeps the session, and the next message re-attaches to it.
#   idle_detach_min: 60
#   # How many messages one answer may become before the whole thing goes up as
#   # an answer.md attachment instead of flooding the channel.
#   max_messages: 8
#   max_lines: 17         # soft cap per message; Discord collapses tall ones
#   # Pretty session names for the WebUI sidebar. Without one a channel is
#   # `discord-<channel_id>`, a thread `discord-<thread_id>`, a DM
#   # `discord-dm-<user_id>`. The id is the identity either way, so renaming a
#   # channel in Discord never loses its conversation.
#   aliases:
#     "987654321098765432": "daq-notes"
#   # Per-channel model, applied when that channel's session is first created.
#   # Re-attaching never switches an existing session — use /model for that.
#   channels:
#     "987654321098765432": {model: "qwen38"}

# Agent tools
tools:
  enabled: true
  allow: [exec, read_file, write_file, list_dir]   # anything not listed is denied
  max_iterations: 8           # max tool rounds per user turn before forced final answer
  exec_timeout: 120           # seconds
  max_output_chars: 8000      # tool output truncation
  # workdir: "/home/you/project"  # base dir for exec and relative paths.
                                # Defaults to the letsClaw directory — the core is a
                                # daemon, so its own cwd is not the shell you started in.

# Conversation settings  (context_length lives per model, under models:)
conversation:
  max_history_messages: 50      # messages kept per session
  rollover_at_percent: 90       # % of the model's context_length that trips a rollover (0 = never)
  rollover_mode: "auto"         # auto = roll over and say so | ask = prompt [y/N] | off = warn only
                                # /new forces a rollover in any mode
  rollover_before_think: true   # roll over BEFORE a turn with no context left to think in,
                                # rather than after one whose thinking was squeezed out.
                                # auto mode only; ask/off are never interrupted pre-turn.
  sessions_dir: "state/sessions"  # archived transcripts land here
  # The journal: a Markdown record written as the turn runs, holding every
  # round's reasoning, every tool call and every tool result in FULL — none of
  # which the JSON transcript beside it can carry (reasoning never enters
  # history, and tool output is clipped to max_output_chars before it does).
  # It lands in sessions_dir as <id>_<name>_<timestamp>.md, is closed by a
  # rollover, and the new window is told to grep it before repeating an
  # investigation. This is what stops the model re-deriving what it already
  # worked out one window ago.
  journal: true
  # Cap on one recorded block, so a runaway `cat` costs a megabyte and not the
  # volume. Nothing you would deliberately run comes close.
  journal_max_block_chars: 1000000
  live_dir: "state/live"        # live conversations; reloaded when the core restarts
  prompt_timeout: 60            # seconds to wait for a rollover answer before keeping the session

# Memory settings
memory:
  long_term_file: "state/memory_store/long_term.md"   # rollover handoffs are appended here

# Logging
logging:
  level: "INFO"
  file: "logs/letclaw.log"
